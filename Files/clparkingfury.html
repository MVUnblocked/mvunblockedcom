<!DOCTYPE HTML>
<html>
<head>
        <title>MVUnblocked</title>
    <link rel="shortcut icon" type="image/jpg" href="https://mvunblocked.com/MVLogo.ico"/>
<body>

    <div id="toolbar-slot"></div>

<script>
fetch('/toolbar.html')
    .then(res => res.text())
    .then(html => {
        const slot = document.getElementById('toolbar-slot');
        slot.innerHTML = html;

        slot.querySelectorAll('script').forEach(oldScript => {
            const newScript = document.createElement('script');
            newScript.textContent = oldScript.textContent;
            document.body.appendChild(newScript);
        });
    });
</script>

    <base href = "https://cdn.jsdelivr.net/gh/cooldude2349/everything@main/parkfury/">

	<head>

</head>

	<script src="src/School.inlined.js"></script>

		html, body { height:100%; background-color: #000000;}
		body { margin:0; padding:0; overflow:hidden; }
	</style>
	<meta name="robots" content="noindex,nofollow" />

</head>
<body>

<div id="gameContainer">

<script type="text/javascript">

window.onload = function() {

	var game = new Phaser.Game(640, 480, Phaser.CANVAS, '');
	
	game.state.add('Boot', ParkingFury.Boot);
	game.state.add('Preloader', ParkingFury.Preloader);
	game.state.add('MainMenu', ParkingFury.MainMenu);
	game.state.add('Game', ParkingFury.Game);
	game.state.add('BlankState', ParkingFury.BlankState);

	game.state.start('Boot');

};

</script>
