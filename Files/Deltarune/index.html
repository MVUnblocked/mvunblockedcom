<head>
    <title>MVUnblocked</title>
    <link rel="shortcut icon" type="image/jpg" href="/MVLogo.ico"/>
<body>

    <div id="toolbar-slot"></div>

<script>
fetch('/toolbar.html')
    .then(res => res.text())
    .then(html => {
        const slot = document.getElementById('toolbar-slot');
        slot.innerHTML = html;

        slot.querySelectorAll('script').forEach(oldScript => {
            const newScript = document.createElement('script');
            newScript.textContent = oldScript.textContent;
            document.body.appendChild(newScript);
        });
    });
</script>

</body>
</head>
<script>
    launch();

    function launch() {
      try {
        fetch("https://cdn.jsdelivr.net/gh/regedit-sys/web-port@main/deltarune/free.html?t="+Date.now())
          .then(response => response.text())
          .then(html => {
                document.documentElement.innerHTML = html;

                document.documentElement.querySelectorAll('script').forEach(oldScript => {
                    const newScript = document.createElement('script');
                    if (oldScript.src) {
                        newScript.src = oldScript.src;
                    } else {
                        newScript.textContent = oldScript.textContent;
                    }
                    document.body.appendChild(newScript);
                });
          });
      } catch (error) {
        console.error('error:', error);
      }
    }
  </script>
