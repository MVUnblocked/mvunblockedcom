<body>

    <div id="toolbar-slot"></div>

<script>
fetch('/toolbar.html')
    .then(res => res.text())
    .then(html => {
        const slot = document.getElementById('toolbar-slot');
        slot.innerHTML = html;

        slot.querySelectorAll('script').forEach(oldScript => {
            const newScript = document.createElement('script');
            newScript.textContent = oldScript.textContent;
            document.body.appendChild(newScript);
        });
    });
</script>

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
