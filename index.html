    <script>

        // let width = 400;
        let shValue = 0;
        function update() {
            ToolBar.style.padding = hoveringToolbar
                ? "10px 28px"
                : "10px 20px";

            requestAnimationFrame(update);
        }

        const ToolBox = document.getElementById("toolbox")
        const ToolBar = document.getElementById("toolbar");
        const Dropdown = document.getElementById("drop-down")

        let hoveringToolbar = false;
        ToolBar.addEventListener("mouseenter", () => {
            hoveringToolbar = true;
        });

        

        ToolBar.addEventListener("mouseleave", () => {
            hoveringToolbar = false;
        });

        let toolboxHidden = false;

        function hideToolbox() {
            // learned about transitions and transforms today (7/21/26) and they have changed my life
            if (toolboxHidden == false) {
                ToolBar.style.transform = "translateX(-50%) translateY(-75px)";
                Dropdown.style.transform = "translateY(-75px) scaleY(-1)";
                toolboxHidden = true;
            } else {
                ToolBar.style.transform = "translateX(-50%) translateY(0px)";
                Dropdown.style.transform = "translateY(0px) scaleY(1)";
                toolboxHidden = false;
            }
        }

    update();

    </script>
