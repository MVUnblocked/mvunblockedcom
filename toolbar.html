  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <style>

        #toolbox, #toolbox * {
            box-sizing: content-box;
        }
        body {
            font-family: "Poppins", sans-serif;
            color: white;
        }

        h1, h4, h5, h6 {
            color: rgb(255, 255, 255);
        }

        .toolbox {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 9999999;
            font-family: "Poppins", sans-serif !important;
            color: white;
        }
        .toolbar {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(128, 128, 128, 0.7);
            font-family: "Poppins", sans-serif !important;
            color: white;
            position: fixed;
            top: 1%;
            left: 50%;
            width: 400px;
            z-index: 9999999;
            transform: translateX(-50%);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            height: 45px;
            /* TODO: Research transitions and shit, and also what the hell this does */
            transition: padding 0.35s cubic-bezier(.34,1.56,.64,1),
                        transform 0.50s cubic-bezier(.34,1.56,.64,1);
            /* UPDATE: thank you mozilla for my css needs*/
        }
        .logo {
            width: 30px;
            height: auto;
        }
        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
            padding: 0;
            margin-left: 20px;
        }
        .nav-link {
            font-family: "Poppins", sans-serif !important;
            color: white;
            text-decoration: none;
            /* just wasted like 20 minutes when i could've done this and below. Fuck me. */
            transition: text-shadow 0.5s ease;
        }

        .nav-link:hover {
            text-shadow: 0 0 15px white, 0 0 35px rgba(255,255,255,0.6);
        }
        .drop-down {
            font-family: "Poppins", sans-serif !important;
            color: white;
            position: fixed;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            border: 1px solid rgba(128, 128, 128, 0.7);
            backdrop-filter: blur(10px);
            top: 78px;
            width: 50px;
            height: 10px;
            background: url(https://mvunblocked.com/Images/ui/arrow.png);
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transition: transform 0.50s cubic-bezier(.34,1.56,.64,1);
            z-index: 99999999;
        }



    </style>
</head>
<body>
    <div class="toolbox" id="toolbox">
    <div class="toolbar" id="toolbar">
        <img class="logo" src="https://mvunblocked.com/MVLogo.ico" alt="Logo">
        <ul class="nav-links">
            <li><a class="nav-link" id="nav-link" style="color: white;" href="https://mvunblocked.com/">Home</a></li>
            <li><a class="nav-link" id="nav-link" style="color: white;" href="https://mvunblocked.com/games">Games</a></li>
            <li><a class="nav-link" id="nav-link" style="color: white;" href="https://mvunblocked.com/faq">FAQ</a></li>
            <li><a class="nav-link" id="nav-link" style="color: white;" href="https://mvunblocked.com/requests">Requests</a></li>
            <li><a class="nav-link" id="nav-link" style="color: white;" href="https://mvunblocked.com/settings">Settings</a></li>
        </ul>
    </div>
        <button class="drop-down" id="drop-down" onclick="hideToolbox()"></button>
    </div>
    <script>

        // let width = 400;
        let shValue = 0;
        function update() {
            ToolBar.style.padding = hoveringToolbar
                ? "10px 28px"
                : "10px 20px";

            requestAnimationFrame(update);
        }

        const ToolBox = document.getElementById("toolbox")
        const ToolBar = document.getElementById("toolbar");
        const Dropdown = document.getElementById("drop-down")

        let hoveringToolbar = false;
        ToolBar.addEventListener("mouseenter", () => {
            hoveringToolbar = true;
        });

        

        ToolBar.addEventListener("mouseleave", () => {
            hoveringToolbar = false;
        });

        let toolboxHidden = false;

        function hideToolbox() {
            // learned about transitions and transforms today (7/21/26) and they have changed my life
            if (toolboxHidden == false) {
                ToolBar.style.transform = "translateX(-50%) translateY(-75px)";
                Dropdown.style.transform = "translateY(-75px) scaleY(-1)";
                toolboxHidden = true;
            } else {
                ToolBar.style.transform = "translateX(-50%) translateY(0px)";
                Dropdown.style.transform = "translateY(0px) scaleY(1)";
                toolboxHidden = false;
            }
        }

    update();

    </script>
    
</body>
</html>
